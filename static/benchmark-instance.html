<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instance Details — mipviz</title>
    <link rel="stylesheet" href="./style.css?v=65">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .instance-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 8px;
        }
        .instance-header h2 {
            font-family: var(--font-body);
            font-size: 24px;
            font-weight: 600;
            color: var(--text);
        }
        .instance-back {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 20px;
            display: inline-block;
        }
        .instance-back:hover { color: var(--accent); }

        .metrics-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: 12px;
            margin-bottom: 32px;
        }
        .metrics-table thead th {
            text-align: left;
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .metrics-table thead th:first-child {
            width: 160px;
        }
        .metrics-table tbody tr {
            border-bottom: 1px solid var(--border-subtle);
        }
        .metrics-table tbody tr:hover {
            background: var(--bg-hover);
        }
        .metrics-table td {
            padding: 6px 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .metrics-table td:first-child {
            font-weight: 500;
            color: var(--text-muted);
            font-size: 11px;
        }
        .metrics-table .col-closed {
            background: rgba(234, 88, 12, 0.04);
        }
        .metrics-table thead .col-closed {
            color: var(--orange);
        }
        :root.light .metrics-table .col-closed {
            background: rgba(234, 88, 12, 0.06);
        }
        .metrics-table .col-separator {
            border-right: 2px solid var(--border);
        }
        .metric-value-none {
            color: var(--text-muted);
            opacity: 0.5;
        }
        .metric-section-label td {
            font-size: 10px !important;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted) !important;
            opacity: 0.6;
            padding-top: 14px !important;
            border-bottom: none !important;
        }
        .metric-section-label td:first-child {
            color: var(--accent) !important;
            opacity: 1;
        }

        /* Log viewer */
        .log-viewer {
            margin-top: 32px;
        }
        .log-viewer h3 {
            font-family: var(--font-body);
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
        }
        .log-tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0;
        }
        .log-tab {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            background: none;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            padding: 8px 16px;
            cursor: pointer;
            transition: color 0.15s, background 0.15s;
            margin-bottom: -1px;
        }
        .log-tab:hover {
            color: var(--text);
            background: var(--bg-hover);
        }
        .log-tab.active {
            color: var(--accent);
            background: var(--bg-raised);
            border-color: var(--border);
            border-bottom-color: var(--bg-raised);
        }
        .log-body {
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            overflow: auto;
            max-height: 70vh;
            padding: 16px;
        }
        .log-body pre {
            margin: 0;
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.5;
            color: var(--text-secondary);
            white-space: pre;
            tab-size: 8;
        }
        .log-loading {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
            padding: 40px;
            text-align: center;
        }

        /* Bound convergence chart */
        .bound-chart-section {
            margin: 32px 0;
        }
        .bound-chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .bound-chart-title {
            font-family: var(--font-body);
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            margin: 0;
        }
        .bound-chart-toggle {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        .bound-chart-toggle:hover {
            color: var(--text);
            border-color: var(--text-muted);
        }
        .bound-chart-toggle.active {
            color: var(--accent);
            border-color: var(--accent);
        }
        .bound-chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-bottom: 10px;
            font-family: var(--font-mono);
            font-size: 11px;
        }
        .bound-legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bound-legend-swatch {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .bound-legend-line-solid {
            width: 16px;
            height: 2px;
            flex-shrink: 0;
        }
        .bound-legend-line-dashed {
            width: 16px;
            height: 0;
            border-top: 2px dashed var(--text-muted);
            flex-shrink: 0;
        }
        .bound-legend-line-dotted {
            width: 16px;
            height: 0;
            border-top: 2px dotted #fbbf24;
            flex-shrink: 0;
        }
        .bound-legend-toggle {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: opacity 0.15s;
        }
        .bound-legend-toggle:hover {
            background: var(--bg-hover);
        }
        .bound-legend-hidden {
            opacity: 0.35;
        }
        .bound-legend-hidden .bound-legend-swatch,
        .bound-legend-hidden .bound-legend-line-solid {
            opacity: 0.4;
        }
        .bound-legend-label {
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .bound-legend-key .bound-legend-label {
            color: var(--text-muted);
        }
        .bound-chart-wrap {
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            background: var(--bg-raised);
        }
        .bound-chart-wrap canvas {
            display: block;
            cursor: crosshair;
        }

        .instance-version-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 0 0 16px;
        }
        .instance-version-config {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
        }
        .version-select {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text);
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 5px 26px 5px 10px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
            background-repeat: no-repeat;
            background-position: right 8px center;
        }
        .version-select:hover { border-color: var(--text-muted); }
        .version-select:focus { outline: none; border-color: var(--accent); }
        .benchmark-note {
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.5;
            color: var(--text-muted);
            background: var(--bg-raised);
            border: 1px solid var(--border-subtle);
            border-left: 2px solid var(--orange);
            border-radius: 4px;
            padding: 8px 12px;
            margin: 0 0 20px;
        }
        .closed-legend {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            margin: -20px 0 24px;
        }
        .closed-swatch {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            background: rgba(234, 88, 12, 0.12);
            border: 1px solid rgba(234, 88, 12, 0.5);
            flex-shrink: 0;
        }
    </style>
</head>

    <script src="./theme.js?v=1"></script>
    <script src="./bound-chart.js?v=6"></script>
    <script>
    // Version-derived state, set by loadVersion().
    let currentVersion = null;
    let SOLVERS = [];
    let SOLVER_LABELS = {};
    let CLOSED_SOURCE = new Set();
    let SOLVER_META = {};

    const instanceNameEl = document.getElementById('instance-name');
    const metricsWrap = document.getElementById('metrics-wrap');
    const logTabs = document.getElementById('log-tabs');
    const logBody = document.getElementById('log-body');
    const logViewer = document.querySelector('.log-viewer');
    const boundContainer = document.getElementById('bound-chart-container');
    const versionSelect = document.getElementById('version-select');
    const versionConfigEl = document.getElementById('version-config');
    const versionNoteEl = document.getElementById('version-note');

    function escapeHtml(s) {
        return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    // Get instance from URL
    const params = new URLSearchParams(window.location.search);
    const instanceKey = params.get('instance');
    const wantedVersion = params.get('v');

    if (!instanceKey) {
        instanceNameEl.textContent = 'No instance specified';
        metricsWrap.innerHTML = '<p style="color:var(--text-muted);font-family:var(--font-mono);font-size:12px">Add ?instance=name.mps.gz to the URL</p>';
    } else {
        const baseName = instanceKey.replace('.mps.gz', '');
        instanceNameEl.textContent = baseName;
        document.title = baseName + ' — Solver Benchmarks — mipviz';
        const viewerLink = document.getElementById('viewer-link');
        viewerLink.href = './index.html#instance=' + encodeURIComponent(baseName);
        viewerLink.style.display = '';

        // Log cache, keyed by version+solver so switching versions stays correct.
        const logCache = {};
        let activeTab = null;

        async function loadLog(solver) {
            if (!currentVersion || !currentVersion.logs) throw new Error('No logs for this version');
            const cacheKey = currentVersion.id + '/' + solver;
            if (logCache[cacheKey]) return logCache[cacheKey];
            const url = './' + currentVersion.logs + '/' + solver + '/' + baseName + '.txt.gz';
            const resp = await fetch(url);
            if (!resp.ok) throw new Error('Log not found');
            const ds = new DecompressionStream('gzip');
            const reader = resp.body.pipeThrough(ds).getReader();
            const decoder = new TextDecoder();
            let text = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                text += decoder.decode(value, { stream: true });
            }
            logCache[cacheKey] = text;
            return text;
        }

        async function showTab(solver) {
            if (activeTab === solver) return;
            activeTab = solver;
            logTabs.querySelectorAll('.log-tab').forEach(t => t.classList.toggle('active', t.dataset.solver === solver));
            logBody.innerHTML = '<div class="log-loading">Loading...</div>';
            try {
                const text = await loadLog(solver);
                logBody.innerHTML = '<pre></pre>';
                logBody.querySelector('pre').textContent = text;
            } catch (e) {
                logBody.innerHTML = '<div class="log-loading">Failed to load log: ' + e.message + '</div>';
            }
        }

        function fmtVal(v) {
            if (v === null || v === undefined) return '<span class="metric-value-none">\u2014</span>';
            if (typeof v === 'number') {
                if (Number.isInteger(v)) return v.toLocaleString();
                if (Math.abs(v) >= 1000) return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
                if (Math.abs(v) >= 1) return v.toLocaleString(undefined, { maximumFractionDigits: 4 });
                return v.toLocaleString(undefined, { maximumFractionDigits: 6 });
            }
            return String(v);
        }

        function fmtTime(v) {
            if (v === null || v === undefined) return '<span class="solve-timeout">timeout</span>';
            let cls;
            if (v <= 10) cls = 'solve-1';
            else if (v <= 100) cls = 'solve-2';
            else if (v <= 1000) cls = 'solve-3';
            else if (v <= 3600) cls = 'solve-4';
            else cls = 'solve-5';
            return '<span class="' + cls + '">' + v + 's</span>';
        }

        function fmtNodes(v) {
            if (v === null || v === undefined) return '<span class="metric-value-none">\u2014</span>';
            let cls;
            if (v <= 100) cls = 'solve-1';
            else if (v <= 10000) cls = 'solve-2';
            else if (v <= 100000) cls = 'solve-3';
            else if (v <= 1000000) cls = 'solve-4';
            else cls = 'solve-5';
            return '<span class="' + cls + '">' + v.toLocaleString() + '</span>';
        }

        function buildTable(data) {
            const solverData = SOLVERS.map(s => data[s] || {});
            const bestObj = data._stats ? data._stats.best_obj : null;
            const hasDetail = !!(currentVersion && currentVersion.detail);

            function fmtDualWithGap(v) {
                if (v === null || v === undefined) return '<span class="metric-value-none">\u2014</span>';
                let valStr = fmtVal(v);
                if (bestObj !== null && bestObj !== 0) {
                    const gap = Math.abs(bestObj - v) / Math.abs(bestObj) * 100;
                    const gapStr = gap < 0.01 ? '0%' : gap < 10 ? gap.toFixed(2) + '%' : gap.toFixed(1) + '%';
                    valStr += ' <span class="cell-time-hint">(' + gapStr + ' gap)</span>';
                }
                return valStr;
            }

            // Times-only versions only have solve time; skip the derived sections.
            const METRICS = hasDetail ? [
                { section: 'Performance' },
                { key: 'time', label: 'Solve time', fmt: fmtTime },
                { key: 'nodes', label: 'Nodes', fmt: fmtNodes },
                { section: 'Presolve' },
                { key: 'presolved_rows', label: 'Presolved rows' },
                { key: 'presolved_cols', label: 'Presolved cols' },
                { section: 'LP Relaxation (before cuts)' },
                { key: 'lp_dual', label: 'Dual bound', fmt: fmtDualWithGap },
                { key: 'lp_primal', label: 'Primal bound' },
                { section: 'Root Node (after cuts)' },
                { key: 'root_dual', label: 'Dual bound', fmt: fmtDualWithGap },
                { key: 'root_primal', label: 'Primal bound' },
            ] : [
                { section: 'Performance' },
                { key: 'time', label: 'Solve time', fmt: fmtTime },
            ];

            function cellCls(i) {
                const meta = SOLVER_META[SOLVERS[i]] || {};
                return (meta.separator ? ' col-separator' : '') + (meta.closedSource ? ' col-closed' : '');
            }

            let html = '<table class="metrics-table"><thead><tr><th>Metric</th>';
            for (let i = 0; i < SOLVERS.length; i++) {
                html += '<th class="' + cellCls(i) + '">' + escapeHtml(SOLVER_LABELS[SOLVERS[i]]) + '</th>';
            }
            html += '</tr></thead><tbody>';

            for (const m of METRICS) {
                if (m.section) {
                    html += '<tr class="metric-section-label"><td>' + m.section + '</td>';
                    for (let i = 0; i < SOLVERS.length; i++) {
                        html += '<td class="' + cellCls(i) + '"></td>';
                    }
                    html += '</tr>';
                    continue;
                }
                html += '<tr><td>' + m.label + '</td>';
                for (let i = 0; i < SOLVERS.length; i++) {
                    const val = solverData[i][m.key];
                    const formatted = m.fmt ? m.fmt(val) : fmtVal(val);
                    html += '<td class="' + cellCls(i) + '">' + formatted + '</td>';
                }
                html += '</tr>';
            }

            html += '</tbody></table>';
            metricsWrap.innerHTML = html;
        }

        function renderStats(instData) {
            const s = instData._stats;
            const statsEl = document.getElementById('instance-stats');
            if (!s || s.cols === null || s.cols === undefined) {
                statsEl.style.display = 'none';
                return;
            }
            const items = [
                { label: 'Variables', value: s.cols, cls: '' },
                { label: 'Constraints', value: s.rows, cls: '' },
                { label: 'Nonzeros', value: s.nonzeros, cls: '' },
                { label: 'Continuous', value: s.continuous, cls: 'accent-blue' },
                { label: 'Integer', value: s.integer, cls: 'accent-green' },
                { label: 'Binary', value: s.binary, cls: 'accent-orange' },
            ];
            statsEl.innerHTML = items.map(it =>
                '<div class="stat-card ' + it.cls + '">' +
                '<span class="stat-value">' + (it.value !== null && it.value !== undefined ? it.value.toLocaleString() : '\u2014') + '</span>' +
                '<span class="stat-label">' + it.label + '</span>' +
                '</div>'
            ).join('');
            statsEl.style.display = '';
        }

        function buildLogTabs() {
            logTabs.innerHTML = '';
            for (const s of SOLVERS) {
                const btn = document.createElement('button');
                btn.className = 'log-tab';
                btn.dataset.solver = s;
                btn.textContent = SOLVER_LABELS[s];
                btn.addEventListener('click', () => showTab(s));
                logTabs.appendChild(btn);
            }
        }

        function applyVersionState() {
            SOLVERS = currentVersion.solvers.map(s => s.key);
            SOLVER_META = {};
            SOLVER_LABELS = {};
            CLOSED_SOURCE = new Set();
            for (const s of currentVersion.solvers) {
                SOLVER_META[s.key] = s;
                SOLVER_LABELS[s.key] = s.label;
                if (s.closedSource) CLOSED_SOURCE.add(s.key);
            }
            window.SOLVER_LABELS = SOLVER_LABELS; // used by bound-chart.js legend
            var hasClosed = currentVersion.solvers.some(function (s) { return s.closedSource; });
            document.getElementById('closed-legend').classList.toggle('hidden', !hasClosed);
            var cfg = currentVersion.attribution || '';
            var src = currentVersion.sourceUrl;
            versionConfigEl.innerHTML = escapeHtml(cfg) +
                (src ? ' <a href="' + escapeHtml(src) + '" target="_blank" rel="noopener">source \u2197</a>' : '');
            if (currentVersion.note) {
                versionNoteEl.textContent = currentVersion.note;
                versionNoteEl.classList.remove('hidden');
            } else {
                versionNoteEl.classList.add('hidden');
            }
        }

        function loadVersion(version) {
            currentVersion = version;
            activeTab = null;
            applyVersionState();
            try {
                var u = new URL(window.location.href);
                u.searchParams.set('v', version.id);
                history.replaceState(null, '', u.toString());
            } catch (e) { /* ignore */ }

            metricsWrap.innerHTML = '<p style="color:var(--text-muted);font-family:var(--font-mono);font-size:12px">Loading...</p>';
            logViewer.style.display = 'none';
            boundContainer.style.display = 'none';

            fetch('./' + version.details)
                .then(r => r.json())
                .then(data => {
                    if (currentVersion !== version) return; // superseded
                    if (!data[instanceKey]) {
                        metricsWrap.innerHTML = '<p style="color:var(--text-muted);font-family:var(--font-mono);font-size:12px">Instance not found in this benchmark version.</p>';
                        return;
                    }
                    const instData = data[instanceKey];
                    renderStats(instData);
                    buildTable(instData);

                    if (version.logs) {
                        logViewer.style.display = '';
                        boundContainer.style.display = '';
                        boundContainer.innerHTML = '';
                        buildLogTabs();
                        logBody.innerHTML = '<div class="log-loading">Select a solver tab to view its log</div>';
                        initBoundChart(boundContainer, instData._stats);
                        SOLVERS.forEach(function (solver) {
                            loadLog(solver).then(function (text) {
                                if (currentVersion === version) addBoundSeries(solver, text);
                            }).catch(function () { /* log not available */ });
                        });
                        showTab(SOLVERS[0]);
                    } else {
                        logTabs.innerHTML = '';
                    }
                })
                .catch(err => {
                    console.error(err);
                    metricsWrap.innerHTML = '<p style="color:var(--text-muted);font-family:var(--font-mono);font-size:12px">Failed to load benchmark data.</p>';
                });
        }

        versionSelect.addEventListener('change', () => {
            const v = MANIFEST.versions.find(x => x.id === versionSelect.value);
            if (v) loadVersion(v);
        });

        let MANIFEST = { versions: [] };

        fetch('./benchmark-versions.json')
            .then(r => r.json())
            .then(manifest => {
                MANIFEST = manifest;
                if (!manifest.versions || !manifest.versions.length) {
                    metricsWrap.innerHTML = '<p style="color:var(--text-muted);font-family:var(--font-mono);font-size:12px">No benchmark versions configured.</p>';
                    return;
                }
                versionSelect.innerHTML = '';
                for (const v of manifest.versions) {
                    const opt = document.createElement('option');
                    opt.value = v.id;
                    opt.textContent = v.label;
                    versionSelect.appendChild(opt);
                }
                let version = manifest.versions.find(v => v.id === wantedVersion) || manifest.versions[0];
                versionSelect.value = version.id;
                loadVersion(version);
            })
            .catch(err => {
                console.error(err);
                metricsWrap.innerHTML = '<p style="color:var(--text-muted);font-family:var(--font-mono);font-size:12px">Failed to load benchmark versions.</p>';
            });
    }
    </script>
</body>
</html>
